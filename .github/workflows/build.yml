name: Desktop validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:desktop
      # Windows packaging remains paused; continue validating both platforms.
      - if: runner.os == 'macOS'
        run: npm run pack:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: Shirixia-${{ matrix.os }}
          path: |
            release/**/*.dmg
            release/**/*.exe
          if-no-files-found: error
